name: Publish the notice page of the previous Boxy

# The previous Boxy lived on GitHub Pages at /boxy/. That address now serves legacy-site/:
# a page that moves the data of existing users to boxy.sadid.my.id and retires the old service worker.

on:
  push:
    branches: [main]
    paths:
      - 'legacy-site/**'
      - '.github/workflows/legacy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-site
      - id: deployment
        uses: actions/deploy-pages@v4
